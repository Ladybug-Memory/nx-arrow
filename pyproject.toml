[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools>=77"]

[project]
name = "nx-arrow"
version = "0.1.0"
description = "Columnar graph storage for NetworkX backed by Apache Arrow"
readme = "README.md"
requires-python = ">=3.12"
license = "BSD-3-Clause"
keywords = ["networks", "graph theory", "apache arrow", "networkx", "columnar"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "networkx>=3.4",
    "pyarrow>=14",
]

[project.urls]
Homepage = "https://github.com/Ladybug-Memory/nx-arrow"
"Source Code" = "https://github.com/Ladybug-Memory/nx-arrow"

[project.entry-points."networkx.backends"]
arrow = "nxarrow.backend:backend_interface"

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
